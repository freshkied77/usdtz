<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="tokenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#ffb347"/>
      <stop offset="100%" style="stop-color:#ff8c00"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="500" height="500" rx="60" fill="url(#bgGrad)"/>
  
  <path d="M250 80 L370 140 L370 280 L250 380 L130 280 L130 140 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="4" opacity="0.3"/>
  
  <path d="M250 100 L350 150 L350 270 L250 350 L150 270 L150 150 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="3" opacity="0.5"/>
  
  <path d="M250 120 L330 160 L330 260 L250 320 L170 260 L170 160 Z" fill="url(#shieldGrad)" opacity="0.15"/>
  
  <circle cx="250" cy="200" r="70" fill="none" stroke="url(#tokenGrad)" stroke-width="6" filter="url(#glow)"/>
  
  <circle cx="250" cy="200" r="55" fill="url(#tokenGrad)" opacity="0.2"/>
  
  <text x="250" y="185" font-family="Arial Black, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">USDT</text>
  <text x="250" y="215" font-family="Arial Black, sans-serif" font-size="22" font-weight="bold" fill="url(#tokenGrad)" text-anchor="middle">.z</text>
  
  <path d="M180 280 Q250 320 320 280" fill="none" stroke="url(#tokenGrad)" stroke-width="4" stroke-linecap="round"/>
  
  <path d="M190 295 Q250 330 310 295" fill="none" stroke="url(#tokenGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  
  <circle cx="250" cy="70" r="8" fill="#ffd700" filter="url(#glow)"/>
  <circle cx="380" cy="130" r="6" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="380" cy="290" r="6" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="250" cy="390" r="8" fill="#ffd700" filter="url(#glow)"/>
  <circle cx="120" cy="290" r="6" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="120" cy="130" r="6" fill="#00f2fe" filter="url(#glow)"/>
  
  <rect x="180" y="420" width="140" height="4" rx="2" fill="url(#tokenGrad)" opacity="0.5"/>
  <rect x="200" y="430" width="100" height="3" rx="1.5" fill="url(#tokenGrad)" opacity="0.3"/>
  
  <text x="250" y="470" font-family="Arial, sans-serif" font-size="14" fill="#aaaaaa" text-anchor="middle">STABILTY • INNOVATION • GROWTH</text>
